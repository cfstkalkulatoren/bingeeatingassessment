<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flonu – Binge Eating Screening</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;700;900&family=Pacifico&display=swap" rel="stylesheet">
<style>
  :root {
    --midnight-moss: #1a3a2f;
    --thyme: #4a7c59;
    --celery: #b5c84b;
    --almond: #f2e8dc;
    --pomegranate: #b83060;
    --mango: #e8732a;
    --lemon: #f0c93a;
    --white: #ffffff;
    --text-dark: #1a3a2f;
    --text-mid: #3d5a4a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Lexend', sans-serif;
    background-color: var(--almond);
    color: var(--text-dark);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* HEADER */
  header {
    background-color: var(--midnight-moss);
    padding: 20px 32px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }

  header::after {
    content: '';
    position: absolute;
    right: -40px;
    top: -30px;
    width: 180px;
    height: 180px;
    background: var(--mango);
    border-radius: 50%;
    opacity: 0.25;
  }

  .logo {
    font-family: 'Pacifico', cursive;
    font-size: 2.2rem;
    color: var(--white);
    letter-spacing: -1px;
    text-decoration: none;
  }

  .logo span {
    color: var(--celery);
  }

  .lang-toggle {
    display: flex;
    gap: 8px;
    position: relative;
    z-index: 2;
  }

  .lang-btn {
    background: transparent;
    border: 2px solid rgba(255,255,255,0.4);
    color: rgba(255,255,255,0.7);
    padding: 6px 16px;
    border-radius: 20px;
    font-family: 'Lexend', sans-serif;
    font-weight: 600;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
  }

  .lang-btn.active {
    background: var(--celery);
    border-color: var(--celery);
    color: var(--midnight-moss);
  }

  /* HERO */
  .hero {
    background: var(--midnight-moss);
    padding: 40px 32px 60px;
    position: relative;
    overflow: hidden;
  }

  .hero-blob {
    position: absolute;
    border-radius: 50%;
    opacity: 0.12;
  }

  .hero-blob-1 {
    width: 300px; height: 300px;
    background: var(--celery);
    bottom: -80px; left: -60px;
  }

  .hero-blob-2 {
    width: 200px; height: 200px;
    background: var(--pomegranate);
    top: -60px; right: 80px;
  }

  .hero-content {
    max-width: 640px;
    margin: 0 auto;
    position: relative;
    z-index: 2;
    text-align: center;
  }

  .hero-tag {
    display: inline-block;
    background: var(--pomegranate);
    color: var(--white);
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 5px 14px;
    border-radius: 20px;
    margin-bottom: 18px;
  }

  .hero h1 {
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    font-weight: 900;
    color: var(--white);
    line-height: 1.2;
    margin-bottom: 14px;
  }

  .hero h1 .accent {
    font-family: 'Pacifico', cursive;
    color: var(--celery);
    font-weight: 400;
  }

  .hero p {
    color: rgba(255,255,255,0.72);
    font-size: 0.95rem;
    font-weight: 300;
    line-height: 1.7;
    max-width: 480px;
    margin: 0 auto;
  }

  /* PROGRESS */
  .progress-wrap {
    max-width: 680px;
    margin: 0 auto;
    padding: 28px 24px 0;
  }

  .progress-bar-bg {
    height: 6px;
    background: rgba(74,124,89,0.2);
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--celery), var(--thyme));
    border-radius: 99px;
    transition: width 0.5s cubic-bezier(.4,0,.2,1);
  }

  .progress-label {
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--thyme);
    margin-top: 7px;
    display: flex;
    justify-content: space-between;
  }

  /* MAIN CONTAINER */
  .main {
    max-width: 680px;
    margin: 0 auto;
    padding: 0 24px 80px;
  }

  /* QUESTION CARD */
  .question-card {
    background: var(--white);
    border-radius: 20px;
    padding: 32px 28px 28px;
    margin-top: 24px;
    box-shadow: 0 4px 24px rgba(26,58,47,0.08);
    animation: slideIn 0.35s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .q-counter {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--thyme);
    margin-bottom: 12px;
  }

  .q-text {
    font-size: 0.98rem;
    font-weight: 600;
    color: var(--midnight-moss);
    line-height: 1.5;
    margin-bottom: 20px;
    padding-bottom: 18px;
    border-bottom: 1px solid rgba(74,124,89,0.12);
  }

  .options-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option-btn {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    width: 100%;
    background: var(--almond);
    border: 2px solid transparent;
    border-radius: 12px;
    padding: 14px 16px;
    cursor: pointer;
    text-align: left;
    font-family: 'Lexend', sans-serif;
    font-size: 0.88rem;
    font-weight: 300;
    color: var(--text-dark);
    line-height: 1.5;
    transition: all 0.18s;
  }

  .option-btn:hover {
    background: rgba(74,124,89,0.08);
    border-color: var(--thyme);
  }

  .option-btn.selected {
    background: rgba(74,124,89,0.12);
    border-color: var(--thyme);
    font-weight: 600;
  }

  .option-dot {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid var(--thyme);
    margin-top: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.18s;
  }

  .option-btn.selected .option-dot {
    background: var(--thyme);
  }

  .option-btn.selected .option-dot::after {
    content: '';
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: white;
  }

  /* NAV */
  .nav-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 24px;
    gap: 12px;
  }

  .btn {
    font-family: 'Lexend', sans-serif;
    font-weight: 700;
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border: none;
    border-radius: 12px;
    padding: 14px 28px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-back {
    background: transparent;
    color: var(--thyme);
    border: 2px solid rgba(74,124,89,0.3);
  }

  .btn-back:hover {
    border-color: var(--thyme);
    background: rgba(74,124,89,0.06);
  }

  .btn-next {
    background: var(--midnight-moss);
    color: var(--white);
    margin-left: auto;
  }

  .btn-next:hover:not(:disabled) {
    background: var(--thyme);
  }

  .btn-next:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  .btn-submit {
    background: var(--pomegranate);
    color: var(--white);
    padding: 16px 36px;
    margin-left: auto;
  }

  .btn-submit:hover {
    background: #9a1f50;
  }

  /* RESULTS */
  .results-card {
    background: var(--white);
    border-radius: 20px;
    padding: 36px 28px;
    margin-top: 24px;
    box-shadow: 0 4px 24px rgba(26,58,47,0.08);
    animation: slideIn 0.4s ease;
  }

  .score-ring-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 28px;
  }

  .score-ring {
    position: relative;
    width: 120px;
    height: 120px;
    margin-bottom: 14px;
  }

  .score-ring svg {
    transform: rotate(-90deg);
  }

  .score-ring .score-num {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }

  .score-num .num {
    font-size: 2.2rem;
    font-weight: 900;
    color: var(--midnight-moss);
    line-height: 1;
  }

  .score-num .of {
    font-size: 0.7rem;
    font-weight: 400;
    color: var(--thyme);
    letter-spacing: 0.05em;
  }

  .severity-badge {
    display: inline-block;
    padding: 6px 20px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .severity-none { background: rgba(181,200,75,0.2); color: #5a6e0a; }
  .severity-mild { background: rgba(240,201,58,0.25); color: #7a6210; }
  .severity-severe { background: rgba(184,48,96,0.2); color: var(--pomegranate); }

  .results-title {
    font-size: 1.3rem;
    font-weight: 900;
    color: var(--midnight-moss);
    text-align: center;
    margin-bottom: 4px;
  }

  .results-subtitle {
    font-size: 0.85rem;
    color: var(--thyme);
    text-align: center;
    font-weight: 300;
    margin-bottom: 24px;
  }

  .divider {
    height: 1px;
    background: rgba(74,124,89,0.12);
    margin: 24px 0;
  }

  .results-section-title {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--thyme);
    margin-bottom: 14px;
  }

  .recommendation-block {
    background: var(--almond);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 14px;
  }

  .recommendation-block p {
    font-size: 0.9rem;
    font-weight: 300;
    line-height: 1.7;
    color: var(--text-dark);
  }

  .recommendation-block p + p {
    margin-top: 10px;
  }

  .disclaimer {
    background: rgba(184,48,96,0.06);
    border-left: 3px solid var(--pomegranate);
    border-radius: 0 12px 12px 0;
    padding: 16px 18px;
    margin-top: 20px;
  }

  .disclaimer p {
    font-size: 0.8rem;
    font-weight: 300;
    color: var(--text-dark);
    line-height: 1.6;
  }

  .source-note {
    text-align: center;
    font-size: 0.73rem;
    color: rgba(26,58,47,0.45);
    margin-top: 22px;
    font-weight: 300;
    line-height: 1.6;
  }

  .source-note a {
    color: var(--thyme);
    text-decoration: none;
    font-weight: 600;
  }

  .btn-restart {
    background: var(--midnight-moss);
    color: var(--white);
    width: 100%;
    text-align: center;
    padding: 16px;
    margin-top: 20px;
    border-radius: 12px;
    font-family: 'Lexend', sans-serif;
    font-weight: 700;
    font-size: 0.82rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-restart:hover { background: var(--thyme); }



  footer {
    background: var(--midnight-moss);
    color: rgba(255,255,255,0.45);
    text-align: center;
    padding: 20px 24px;
    font-size: 0.75rem;
    font-weight: 300;
    letter-spacing: 0.03em;
  }

  footer a { color: var(--celery); text-decoration: none; font-weight: 600; }

  @media (max-width: 480px) {
    header { padding: 16px 20px; }
    .hero { padding: 28px 20px 44px; }
    .main { padding: 0 16px 60px; }
    .question-card, .results-card { padding: 24px 18px 20px; }
    .btn { padding: 12px 20px; font-size: 0.75rem; }
  }
</style>
</head>
<body>

<header>
  <a class="logo" href="#">Flo<span>nu</span></a>
  <div class="lang-toggle">
    <button class="lang-btn active" onclick="setLang('de')">DE</button>
    <button class="lang-btn" onclick="setLang('en')">EN</button>
  </div>
</header>

<div class="hero">
  <div class="hero-blob hero-blob-1"></div>
  <div class="hero-blob hero-blob-2"></div>
  <div class="hero-content">
    <div class="hero-tag" id="hero-tag">Kostenloses Screening</div>
    <h1 id="hero-title">Wie ist dein Verhältnis <br>zum <span class="accent">Essen?</span></h1>
    <p id="hero-desc">Dieser Fragebogen gibt dir einen ersten Hinweis darauf, wie du mit Essimpulsen umgehst. Kein Urteil, keine Diagnose. Nur ein ehrlicher Startpunkt.</p>
  </div>
</div>

<div class="progress-wrap" id="progress-wrap" style="display:none;">
  <div class="progress-bar-bg">
    <div class="progress-bar-fill" id="progress-fill" style="width: 0%"></div>
  </div>
  <div class="progress-label">
    <span id="progress-text">Frage 1 von 16</span>
    <span id="progress-pct">0 %</span>
  </div>
</div>

<div class="main">
  <div id="quiz-container"></div>
</div>

<footer>
  &copy; 2025 Flonu / Coach Aleks &nbsp;·&nbsp; <a href="https://flonu.de" target="_blank">flonu.de</a>
</footer>

<script>

};

const questions = {
  de: [
    {
      text: 'Wie gehst du mit deinem Körperbild in Gegenwart anderer um?',
      options: [

        { text: 'Mein Aussehen und mein Gewicht machen mich manchmal unsicher, und das ärgert mich.', score: 1 },

// STATE
let lang = 'de';
let currentQ = 0;
let answers = new Array(16).fill(null);

function setLang(l) {
  lang = l;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.textContent === l.toUpperCase()));
  document.getElementById('hero-tag').textContent = translations[l].heroTag;
  document.getElementById('hero-title').innerHTML = translations[l].heroTitle;
  document.getElementById('hero-desc').textContent = translations[l].heroDesc;
  if (currentQ < questions[lang].length) {
    renderQuestion();
  }
}

function getResult(score) {
  return results[lang].find(r => score >= r.range[0] && score <= r.range[1]);
}

function getScoreColor(score) {
  if (score <= 17) return '#b5c84b';
  if (score <= 26) return '#f0c93a';
  return '#b83060';
}

function renderQuestion() {
  const t = translations[lang];
  const q = questions[lang][currentQ];
  const total = questions[lang].length;
  const pct = Math.round(((currentQ) / total) * 100);

  document.getElementById('progress-wrap').style.display = 'block';
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = t.progressLabel(currentQ + 1, total);
  document.getElementById('progress-pct').textContent = pct + ' %';

  const isLast = currentQ === total - 1;

  let optionsHTML = q.options.map((opt, i) => `
    <li>
      <button class="option-btn ${answers[currentQ] === i ? 'selected' : ''}" onclick="selectOption(${i})">
        <span class="option-dot"></span>
        <span>${opt.text}</span>
      </button>
    </li>
  `).join('');

  document.getElementById('quiz-container').innerHTML = `
    <div class="question-card">
      <div class="q-counter">${t.qCounter(currentQ + 1)}</div>
      <div class="q-text">${q.text}</div>
      <ul class="options-list">${optionsHTML}</ul>
      <div class="nav-row">
        ${currentQ > 0 ? `<button class="btn btn-back" onclick="goBack()">${t.btnBack}</button>` : '<div></div>'}
        ${isLast
          ? `<button class="btn btn-submit" onclick="submitQuiz()" ${answers[currentQ] === null ? 'disabled' : ''}>${t.btnSubmit}</button>`
          : `<button class="btn btn-next" onclick="goNext()" ${answers[currentQ] === null ? 'disabled' : ''}>${t.btnNext}</button>`}
      </div>
    </div>
  `;
}

function selectOption(i) {
  answers[currentQ] = i;
  renderQuestion();
}

function goNext() {
  if (answers[currentQ] === null) return;
  currentQ++;
  renderQuestion();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goBack() {
  currentQ--;
  renderQuestion();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function submitQuiz() {
  const t = translations[lang];
  let score = 0;
  answers.forEach((answerIdx, qIdx) => {
    if (answerIdx !== null && questions[lang][qIdx]) {
      score += questions[lang][qIdx].options[answerIdx].score;
    }
  });

  const result = getResult(score);
  const strokeColor = getScoreColor(score);
  const circumference = 2 * Math.PI * 44;
  const pct = Math.round((score / 46) * 100);
  const dashOffset = circumference - (pct / 100) * circumference;

  document.getElementById('progress-fill').style.width = '100%';
  document.getElementById('progress-text').textContent = t.progressLabel(16, 16);
  document.getElementById('progress-pct').textContent = '100 %';

  // Spectrum SVG
  const specLabels = spectrumLabels[lang];
  const specPos = result.spectrumPosition;
  const specColors = ['#b5c84b', '#f0c93a', '#b83060'];
  const specBgColors = ['rgba(181,200,75,0.15)', 'rgba(240,201,58,0.15)', 'rgba(184,48,96,0.12)'];
  const spectrumSVG = `
    <svg viewBox="0 0 420 80" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:420px;display:block;margin:0 auto;">
      <!-- Arrow shape -->
      <defs>
        <linearGradient id="specGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" style="stop-color:#b5c84b;stop-opacity:0.7"/>
          <stop offset="50%" style="stop-color:#f0c93a;stop-opacity:0.7"/>
          <stop offset="100%" style="stop-color:#b83060;stop-opacity:0.7"/>
        </linearGradient>
      </defs>
      <polygon points="0,20 380,20 420,40 380,60 0,60" fill="url(#specGrad)" rx="4"/>
      <!-- Dividers -->
      <line x1="140" y1="20" x2="140" y2="60" stroke="white" stroke-width="1.5" opacity="0.6"/>
      <line x1="280" y1="20" x2="280" y2="60" stroke="white" stroke-width="1.5" opacity="0.6"/>
      <!-- Labels -->
      <text x="70" y="44" text-anchor="middle" font-size="9" font-weight="600" fill="#1a3a2f" font-family="sans-serif">${specLabels[0]}</text>
      <text x="210" y="44" text-anchor="middle" font-size="9" font-weight="600" fill="#1a3a2f" font-family="sans-serif">${specLabels[1]}</text>
      <text x="335" y="44" text-anchor="middle" font-size="9" font-weight="600" fill="#1a3a2f" font-family="sans-serif">${specLabels[2]}</text>
      <!-- Active indicator -->
      <circle cx="${specPos === 0 ? 70 : specPos === 1 ? 210 : 335}" cy="40" r="14" fill="${specColors[specPos]}" opacity="0.9"/>
      <text x="${specPos === 0 ? 70 : specPos === 1 ? 210 : 335}" y="44" text-anchor="middle" font-size="10" font-weight="900" fill="white" font-family="sans-serif">●</text>
    </svg>`;

  // Tips HTML
  const tipsHTML = result.tips.map(tip => `
    <div style="display:flex;gap:14px;align-items:flex-start;padding:14px 16px;background:var(--almond);border-radius:12px;margin-bottom:10px;">
      <span style="font-size:1.4rem;flex-shrink:0;margin-top:2px;">${tip.icon}</span>
      <div>
        <div style="font-size:0.78rem;font-weight:700;color:var(--midnight-moss);margin-bottom:4px;letter-spacing:0.03em;">${tip.title}</div>
        <div style="font-size:0.85rem;font-weight:300;color:var(--text-dark);line-height:1.65;">${tip.text}</div>
      </div>
    </div>`).join('');

  // Therapy HTML (groups 2 & 3)
  const th = therapyInfo[lang];
  const therapyHTML = result.showTherapy ? `
    <div class="divider"></div>
    <div class="results-section-title">${th.title}</div>
    <div style="display:grid;gap:12px;margin-bottom:4px;">
      <div style="background:rgba(74,124,89,0.07);border-left:3px solid var(--thyme);border-radius:0 12px 12px 0;padding:16px 18px;">
        <div style="font-size:0.78rem;font-weight:700;color:var(--thyme);margin-bottom:6px;">${th.kvt.name}</div>
        <div style="font-size:0.84rem;font-weight:300;color:var(--text-dark);line-height:1.65;">${th.kvt.text}</div>
      </div>
      <div style="background:rgba(74,124,89,0.07);border-left:3px solid var(--thyme);border-radius:0 12px 12px 0;padding:16px 18px;">
        <div style="font-size:0.78rem;font-weight:700;color:var(--thyme);margin-bottom:6px;">${th.ipt.name}</div>
        <div style="font-size:0.84rem;font-weight:300;color:var(--text-dark);line-height:1.65;">${th.ipt.text}</div>
      </div>
    </div>` : '';

  document.getElementById('quiz-container').innerHTML = `
    <div class="results-card">

      <!-- Score ring + badge -->
      <div class="score-ring-wrap">
        <div class="score-ring">
          <svg width="120" height="120" viewBox="0 0 120 120">
            <circle cx="60" cy="60" r="44" fill="none" stroke="rgba(74,124,89,0.12)" stroke-width="10"/>
            <circle cx="60" cy="60" r="44" fill="none" stroke="${strokeColor}" stroke-width="10"
              stroke-dasharray="${circumference}" stroke-dashoffset="${dashOffset}" stroke-linecap="round"/>
          </svg>
          <div class="score-num">
            <span class="num">${score}</span>
            <span class="of">${t.scoreOf}</span>
          </div>
        </div>
        <span class="severity-badge severity-${result.severity}">${result.label}</span>
        <div class="results-title">${result.title}</div>
        <div class="results-subtitle">${result.subtitle}</div>
      </div>

      <!-- Spectrum -->
      <div class="divider"></div>
      <div class="results-section-title" style="margin-bottom:14px;">${lang === 'de' ? 'Essverhalten — ein Spektrum' : 'Eating Behavior — a Spectrum'}</div>
      <div style="margin-bottom:6px;">${spectrumSVG}</div>
      <div style="display:flex;justify-content:space-between;font-size:0.68rem;color:var(--thyme);font-weight:300;margin-bottom:4px;padding:0 4px;">
        ${specLabels.map((l, i) => `<span style="text-align:${i===0?'left':i===1?'center':'right'};flex:1;${i===specPos?'font-weight:700;color:var(--midnight-moss);':''}">${l}</span>`).join('')}
      </div>

      <!-- Intro text -->
      <div class="divider"></div>
      <div style="font-size:0.9rem;font-weight:300;color:var(--text-dark);line-height:1.75;margin-bottom:4px;">${result.intro}</div>

      <!-- Tips -->
      <div class="divider"></div>
      <div class="results-section-title" style="margin-bottom:12px;">${lang === 'de' ? 'Was du jetzt tun kannst' : 'What you can do now'}</div>
      ${tipsHTML}

      <!-- Therapy info -->
      ${therapyHTML}

      <!-- Disclaimer -->
      <div class="divider"></div>
      <div class="disclaimer">
        <div class="results-section-title" style="margin-bottom:6px;">${t.disclaimerLabel}</div>
        <p>${t.disclaimer}</p>
      </div>

      <!-- Source -->
      <div class="source-note">
        ${t.sourceLabel}: ${t.source}<br>
        <a href="https://flonu.de" target="_blank">flonu.de</a>
      </div>

      <button class="btn-restart" onclick="restart()">${t.btnRestart}</button>
    </div>
  `;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function restart() {
  currentQ = 0;
  answers = new Array(16).fill(null);
  renderQuestion();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// INIT
renderQuestion();


</script>
</body>
</html>
